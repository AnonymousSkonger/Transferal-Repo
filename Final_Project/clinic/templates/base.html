{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clinic Appointment System{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <img src="{% static 'media/logo.webp' %}" alt="Clinic Logo" class="logo">
                <span class="brand-title">CareClinic</span>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>
                <li><a href="">Log in</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        {% block content %} {% endblock content %}
    </main>

    <footer>
        <p>&copy; 2026 Coding Academy. All rights reserved.</p>
    </footer>
</body>
</html>
