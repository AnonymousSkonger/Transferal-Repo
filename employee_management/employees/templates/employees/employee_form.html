<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
</head>
<body>
    <h1>Employee Form</h1>
    <form method="POST">
        <!-- Add the CSRF token -->
        {% csrf_token %}
        <!-- Display the form fields and validation errors -->
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Save Employee</button>
    </form>
    <a href="{% url 'employees:employee_list' %}">Cancel</a>
</body>
</html>
