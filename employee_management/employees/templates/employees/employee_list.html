<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
</head>
<body>
    <h1>Employee Management System</h1>
    <a href="{% url 'employees:employee_create' %}">
        Add Employee
    </a>
    <table border="1">
        <thead>
            <tr>
                <th>Employee Number</th>
                <th>Name</th>
                <th>Surname</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.employeeNumber }}</td>
                <td>{{ employee.name }}</td>
                <td>{{ employee.surname }}</td>
                <td>{{ employee.email }}</td>
                <td>
                    <!-- Add links to view, update and delete -->
                    <a href="{% url 'employees:employee_detail' employee.pk %}">View</a> |
                    <a href="{% url 'employees:employee_update' employee.pk %}">Update</a> |
                    <a href="{% url 'employees:employee_delete' employee.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No employees found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
